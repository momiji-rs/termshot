name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustc --version
          cc --version
      - name: unit tests, cli checks, pixel goldens
        run: ./test.sh
      - name: keep renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: target/test/

  sanitize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: draw.c under ASan + UBSan
        run: SANITIZE=1 ./test.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustc 1.70 (let-else, is_some_and)
        run: |
          rustup toolchain install 1.70.0 --profile minimal
          RUSTUP_TOOLCHAIN=1.70.0 ./test.sh
