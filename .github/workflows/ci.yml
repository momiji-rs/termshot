name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustc --version
          cc --version
      - name: unit tests, cli checks, pixel goldens
        run: ./test.sh
      - name: extended pixels, codec round trips, and profiling
        run: SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 ./tests/run.sh
      - name: keep renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: target/test/
      # Link-and-run check for the C vs Rust POC on the host where the old
      # -C link-arg order broke (#30): 1 round, no timing kept. The script
      # archives an old commit, so fetch just that one into the shallow clone.
      - name: c-vs-rust bench links and agrees (aarch64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          rev=$(sed -n 's/^rev=//p' bench/c-vs-rust/run.sh)
          git fetch --no-tags --depth=1 origin "$rev"
          bench/c-vs-rust/run.sh 1

  sanitize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: draw.c under ASan + UBSan
        run: SANITIZE=1 ./test.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustc 1.70 (let-else, is_some_and)
        run: |
          rustup toolchain install 1.70.0 --profile minimal
          RUSTUP_TOOLCHAIN=1.70.0 ./test.sh
