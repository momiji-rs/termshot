name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rustc
      - name: build, compare pixels, and check codecs with sanitizers
        env:
          SANITIZE: '1'
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          rustc --version
          cc --version
          ./tests/run.sh
