name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustc --version
          cc --version
      - name: unit tests, cli checks, pixel goldens
        run: ./test.sh
      - name: extended pixels, codec round trips, and profiling
        run: SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 ./tests/run.sh
      - name: keep renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: target/test/
      # Link-and-run check for the C vs Rust comparisons on the host where the
      # old -C link-arg order broke (#30): 1 round, no timing kept. The script
      # archives older commits, so fetch just those into the shallow clone.
      - name: c-vs-rust bench links and agrees (aarch64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          revs=$(sed -n 's/^[a-z_]*rev=//p' bench/c-vs-rust/run.sh)
          git fetch --no-tags --depth=1 origin $revs
          bench/c-vs-rust/run.sh 1
          bench/c-vs-rust/run.sh deflate 1
      # Box drawing in Rust paints what draw.c's did, pixel for pixel, at every
      # cell size, on each host's compiler and libm (#12 step 2a).
      - name: geometry matches the C it was ported from
        run: |
          git fetch --no-tags --depth=1 origin $(sed -n 's/^geometry_rev=//p' bench/c-vs-rust/run.sh)
          bench/c-vs-rust/run.sh geometry 1
      # The image layers and the backdrop in Rust paint what draw.c's did, on
      # random scenes and through the CLI, on each host (#12 step 2b).
      - name: image layers match the C they were ported from
        run: |
          git fetch --no-tags --depth=1 origin $(sed -n 's/^images_rev=//p' bench/c-vs-rust/run.sh)
          bench/c-vs-rust/run.sh images 1
      # The glyphs, marks, lines and missing-glyph boxes in Rust paint what
      # draw.c's did, through the CLI with each kind of font at several
      # sizes, on each host (#12 step 2c).
      - name: glyph painting matches the C it was ported from
        run: |
          git fetch --no-tags --depth=1 origin $(sed -n 's/^glyphs_rev=//p' bench/c-vs-rust/run.sh)
          bench/c-vs-rust/run.sh glyphs 1

  sanitize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: draw.c under ASan + UBSan
        run: SANITIZE=1 ./test.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustc 1.70 (let-else, is_some_and)
        run: |
          rustup toolchain install 1.70.0 --profile minimal
          RUSTUP_TOOLCHAIN=1.70.0 ./test.sh
