name: screens

# Screens rendered by the termshot built from this commit, compared on every pull
# request with main's by momiji-rs/termshot-action.
#
# One job renders and publishes, which is the action's simplest setup rather
# than its least-privilege one. Its publish step re-renders logs with a released
# termshot, so here, where the renderer is what changes, it would show the wrong
# pixels. termshot has no dependencies to compromise the build, and the checkout
# keeps no token for the build to use. A fork's pull request gets a read-only
# token, so its screens go to the job summary and the artifact only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write        # store the images on the termshot-assets branch
  pull-requests: write   # post the comment

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./build.sh
      - uses: momiji-rs/termshot-action@v0
        with:
          termshot-path: ./termshot
          logs: examples/*.pty
          shots: |
            help: ./termshot --help | head -28
            colors@48x1: for i in 0 1 2 3 4 5 6 7; do printf '\e[4%dm  \e[10%dm  ' $i $i; done; printf '\e[0m'
            less@60x12: seq 1 200 | less
              wait-for 1
              snap top
              key space space
              type /150
              key enter
