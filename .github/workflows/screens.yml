name: screens

# Dogfoods action/: renders the samples and a few commands with the termshot built
# from this commit, and shows on the pull request what changed.
on:
  pull_request:
  push:
    # poc/** too, so a pull request based on the proof-of-concept branch has a baseline
    branches: [main, 'poc/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  action-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: python3 action/tests/run.py ./termshot

  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: ./action
        with:
          termshot-path: ./termshot
          logs: examples/*.pty
          shots: |
            help: ./termshot --help | head -28
            colors@48x1: for i in 0 1 2 3 4 5 6 7; do printf '\e[4%dm  \e[10%dm  ' $i $i; done; printf '\e[0m'
            less@60x12: seq 1 200 | less
              wait-for 1
              snap top
              key space space
              type /150
              key enter
