name: screens

# Screens rendered by the termshot built from this commit, compared on every pull
# request with main's by momiji-rs/termshot-action.
#
# The job that builds and runs this commit's code holds no permissions. The job
# that publishes runs none of it: it takes the images the first job rendered
# (images: bundle), which the action checks as untrusted data, because here the
# renderer is what a pull request changes. A fork's pull request gets read-only
# tokens in both jobs, so its screens go to the job summary and the artifact only.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push cancels the run it supersedes. The action also refuses to publish
# for a commit that is no longer the head.
concurrency:
  group: screens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./build.sh
      - uses: momiji-rs/termshot-action@c0f334263e2ef7dc47d9761ec5ea85b9c3dc42a5 # v0.5.0
        with:
          mode: render
          termshot-path: ./termshot
          logs: examples/*.pty
          shots: |
            help: ./termshot --help | head -28
            colors@48x1: for i in 0 1 2 3 4 5 6 7; do printf '\e[4%dm  \e[10%dm  ' $i $i; done; printf '\e[0m'
            less@60x12: seq 1 200 | less
              wait-for 1
              snap top
              key space space
              type /150
              key enter

  publish:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write        # store the images on the termshot-assets branch
      pull-requests: write   # post the comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termshot-termshot
          path: ${{ runner.temp }}/screens
      - uses: momiji-rs/termshot-action@c0f334263e2ef7dc47d9761ec5ea85b9c3dc42a5 # v0.5.0
        with:
          bundle-dir: ${{ runner.temp }}/screens
          images: bundle
