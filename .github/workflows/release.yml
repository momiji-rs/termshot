name: release

# A v* tag builds, checks and publishes the archives. A pull request that
# touches the release path or the source builds and checks them without
# publishing: musl's libm is not glibc's or Apple's, and the check renders
# the samples on each archive's own target.
#
# To release 1.2.3: set VERSION in src/main.rs to "1.2.3", rename
# CHANGELOG.md's [Unreleased] to "[1.2.3] - <date>", merge, then push tag
# v1.2.3. The build fails if the tag and --version differ, and publish fails
# if CHANGELOG.md has no section for the version. After the GitHub release,
# the npm job publishes @momiji-rs/termshot and its three platform packages
# from the same archives (scripts/npm-stage.sh), by npm Trusted Publishing:
# no token. Each of the four packages names this repo and release.yml as its
# trusted publisher on npmjs.com.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.sh
      - scripts/release.sh
      - scripts/npm-stage.sh
      - 'npm/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: linux-x86_64-musl
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - platform: linux-aarch64-musl
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
          rustup target add ${{ matrix.targets }}
          rustc --version
          cc --version
      - name: build and check
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/release.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "termshot ${GITHUB_REF_NAME#v}" --notes-file ../notes.md

  # The npm job holds id-token: write, npm's publish credential under Trusted
  # Publishing, so the actions both npm jobs run are pinned to commits.
  #
  # Install the staged packages on each platform the launcher maps, with the
  # oldest Node the package declares (engines), and run them.
  npm-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    package: linux-x64 }
          - { os: ubuntu-24.04-arm, package: linux-arm64 }
          - { os: macos-latest,     package: darwin-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: stage
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version=$(ls dist/termshot-*-linux-x86_64-musl.tar.gz | sed 's/.*termshot-\(.*\)-linux-x86_64-musl.tar.gz/\1/')
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "the archives are $version, the tag is $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          scripts/npm-stage.sh "$version" dist npm-out
      - name: install and run
        run: |
          mkdir smoke
          for dir in npm-out/*; do (cd smoke && npm pack "../$dir"); done
          cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund "./momiji-rs-termshot-${{ matrix.package }}-$version.tgz" "./momiji-rs-termshot-$version.tgz"
          test "$(npx termshot --version)" = "termshot $version"
          printf 'ok\r\n' | npx termshot --text - --size 10x2 - | grep -qx ok
          rc=0; npx termshot --bogus 2> /dev/null || rc=$?
          test "$rc" = 2

  # After the GitHub release, publish the packages that npm-check ran.
  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [npm-check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: stage
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version=$(ls dist/termshot-*-linux-x86_64-musl.tar.gz | sed 's/.*termshot-\(.*\)-linux-x86_64-musl.tar.gz/\1/')
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "the archives are $version, the tag is $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          scripts/npm-stage.sh "$version" dist npm-out
      - name: publish
        run: |
          # Trusted Publishing needs npm 11.5.1 or newer. Pinned, as the
          # actions are: it runs with the OIDC token.
          npm install -g npm@12.2.0
          # The platform packages go first: the main one depends on them. A
          # version npm already has is skipped, so a failed run can be rerun.
          for dir in npm-out/termshot-* npm-out/termshot; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "./$dir" --access public
            fi
          done
